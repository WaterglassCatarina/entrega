<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Waterglass · Presentation</title>
<link rel="icon" href="https://images.squarespace-cdn.com/content/v1/65ccd5642ae29666675bdf69/38949765-80d8-41a0-bcd4-b075add74bd6/favicon.ico?format=100w">
<style>
  @font-face { font-family: "Pontano Sans"; font-style: normal; font-weight: 300 700; font-display: swap; src: url(https://fonts.gstatic.com/s/pontanosans/v19/qFdD35GdgYR8EzR6oBLDHa3axT8NoVgyNA.woff2) format("woff2"); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #152e4e;
    --light-blue: #b4c2d6;
    --white: #ffffff;
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--navy);
    color: var(--white);
    font-family: 'Pontano Sans', 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }

  .container {
    text-align: center;
    max-width: 960px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo {
    width: 900px;
    max-width: 92vw;
    transform: translateX(1.17%); /* offsets uneven transparent padding in the PNG */
    height: auto;
    margin-bottom: 48px;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }

  /* ── Button ── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 18px 44px;
    border-radius: 300px;
    background: var(--white);
    color: var(--navy);
    font-family: 'Pontano Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    border: none;
    transition: transform .08s ease, box-shadow .08s ease, background .15s ease;
    min-width: 240px;
    min-height: 58px;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(0,0,0,.25);
  }
  .btn:active {
    transform: scale(.96);
    box-shadow: none;
    background: #e8edf3;
  }
  .btn.loading {
    background: #d0dae8;
    pointer-events: none;
  }
  .btn.done {
    background: #d0f0e0;
    color: #0a4a2a;
  }

  /* ── Spinner ── */
  .spinner {
    display: none;
    width: 18px;
    height: 18px;
    border: 2.5px solid rgba(21,46,78,.25);
    border-top-color: var(--navy);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Post-click note ── */
  .note {
    margin-top: 20px;
    font-size: .88rem;
    color: var(--light-blue);
    min-height: 1.4em;
    opacity: 0;
    transition: opacity .4s ease;
  }
  .note.visible {
    opacity: 1;
  }

  /* ── Error state ── */
  .error-box {
    display: none;
  }
  .error-box p {
    color: var(--light-blue);
    font-size: 1rem;
    line-height: 1.6;
  }
  .error-box p strong {
    color: var(--white);
    display: block;
    font-size: 1.3rem;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
<div class="container">

  <img class="logo"
    src="https://images.squarespace-cdn.com/content/v1/65ccd5642ae29666675bdf69/e5c4f3f0-06db-49c2-bc01-9d410126dd46/WG_white_signature_.png?format=1500w"
    alt="Waterglass">

  <div id="ok-state" style="display:none;flex-direction:column;align-items:center;">
    <a id="dl-btn" class="btn" href="#" rel="noopener noreferrer">
      <span class="spinner" id="spinner"></span>
      <span id="btn-label">Click here to download</span>
    </a>
    <p class="note" id="note" aria-live="polite"></p>
  </div>

  <noscript><p style="color:#b4c2d6;margin-top:8px">Please enable JavaScript to download your file.</p></noscript>

  <div class="error-box" id="error-state">
    <p><strong>Link not found</strong>Please contact us for a new download link.</p>
  </div>

</div>

<script>
(function () {
  /* ── CONFIG ── */
  var MY_HOST   = "waterglassconsulting-my.sharepoint.com";
  var MY_OWNER  = "catarina_barroso_waterglass-consulting_com";
  var SP_HOST   = "waterglassconsulting.sharepoint.com";
  var ALLOWED   = [MY_HOST, SP_HOST];

  /* ── Helpers ── */
  function b64dec(s) {
    var b = s.replace(/-/g, "+").replace(/_/g, "/");
    while (b.length % 4) b += "=";
    return atob(b);
  }

  function buildDownloadUrl(raw) {
    var u = new URL(raw);
    if (u.protocol !== "https:") throw new Error("proto");
    if (ALLOWED.indexOf(u.hostname.toLowerCase()) === -1) throw new Error("host");
    u.searchParams.delete("web");
    u.searchParams.set("download", "1");
    return u.toString();
  }

  /* ── Link decoder ──
     Format v1 (short):  #1<type><shareId>,<token>
       e.g. #1pIQAXn5G...,2hYq26
       Reconstructs: https://MY_HOST/:<type>:/g/personal/MY_OWNER/<shareId>?e=<token>

     Format v0 (legacy): #f=<base64url(full URL)>  or  #0m<base64url(path+qs)>
  */
  function decodeFragment(frag) {
    if (!frag) throw new Error("empty");
    var m;

    /* v1 short link — ignores anything appended after the token (trackers, punctuation) */
    m = /^1([a-z])([A-Za-z0-9_-]+),([A-Za-z0-9_-]+)/i.exec(frag);
    if (m) {
      return buildDownloadUrl("https://" + MY_HOST + "/:" + m[1].toLowerCase() + ":/g/personal/" +
                              MY_OWNER + "/" + m[2] + "?e=" + m[3]);
    }

    /* v0 host-code format: 0<m|t><b64url(path?qs)> */
    m = /^0([mt])([A-Za-z0-9_-]+)/.exec(frag);
    if (m) {
      var path = b64dec(m[2]);
      if (path.charAt(0) !== "/") throw new Error("fmt");
      return buildDownloadUrl("https://" + (m[1] === "t" ? SP_HOST : MY_HOST) + path);
    }

    /* legacy: f=<b64url(fullUrl)> */
    m = /(?:^|&)f=([A-Za-z0-9_-]+)/.exec(frag);
    if (m) return buildDownloadUrl(b64dec(m[1]));

    throw new Error("fmt");
  }

  /* Some email security scanners re-encode links (e.g. "," -> "%2C") or move the
     code from "#" to "?"; accept both. */
  function readCode() {
    var raw = window.location.hash ? window.location.hash.slice(1) : window.location.search.slice(1);
    try { raw = decodeURIComponent(raw); } catch (e) {}
    return raw.replace(/^\s+|\s+$/g, "");
  }

  /* ── Init ── */
  var frag = readCode();
  var btn    = document.getElementById("dl-btn");
  var label  = document.getElementById("btn-label");
  var spinner = document.getElementById("spinner");
  var note   = document.getElementById("note");

  try {
    var dlUrl = decodeFragment(frag);
    btn.href = dlUrl;
    document.getElementById("ok-state").style.display = "flex";
  } catch (e) {
    document.getElementById("ok-state").style.display = "none";
    document.getElementById("error-state").style.display = "block";
    return;
  }

  /* ── Click feedback ── */
  btn.addEventListener("click", function (ev) {
    if (btn.classList.contains("loading")) return;
    btn.classList.remove("done");
    note.classList.remove("visible");
    clearTimeout(btn._t1); clearTimeout(btn._t2);

    /* Trigger the browser download (the href already has &download=1) */
    /* No preventDefault — allow the browser to follow the link naturally */

    /* Visual: loading state */
    btn.classList.add("loading");
    spinner.style.display = "block";
    label.textContent = "Starting download…";

    /* After ~2.2 s switch to done state */
    btn._t1 = setTimeout(function () {
      btn.classList.remove("loading");
      btn.classList.add("done");
      spinner.style.display = "none";
      label.textContent = "✓ Download started";
      note.textContent = "If the download didn’t start, click the button again.";
      note.classList.add("visible");
      /* Stays green; clicking again re-triggers the download */
    }, 2200);
  });
})();
</script>
</body>
</html>
